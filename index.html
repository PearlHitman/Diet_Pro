    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F0F13" media="(prefers-color-scheme: dark)" />

    <style>
      html, body, #root { margin: 0; padding: 0; min-height: 100vh; background: #FFFFFF; }
      :root[data-theme="dark"] html, :root[data-theme="dark"] body, :root[data-theme="dark"] #root { background: #0F0F13; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) html,
        :root:not([data-theme="light"]) body,
        :root:not([data-theme="light"]) #root { background: #0F0F13; }
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body { font-family: "SF Pro Text", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    </style>
